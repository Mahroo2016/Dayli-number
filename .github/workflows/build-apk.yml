name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/example/numberdaily
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NumberDaily"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.6.1" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.example.numberdaily"
              compileSdk 35

              defaultConfig {
                  applicationId "com.example.numberdaily"
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName "3.0"
              }
          }
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.NumberDaily"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#6750A4</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/Theme.NumberDaily"
                  android:label="ثبت روزانه"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/example/numberdaily/MainActivity.java <<'EOF'
          package com.example.numberdaily;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.BaseAdapter;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.Collections;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private SharedPreferences sp;
              private final ArrayList<Record> records = new ArrayList<>();

              private EditText input;
              private TextView totalView;
              private TextView countView;
              private TextView todayView;
              private RecordAdapter adapter;

              static class Record {
                  String date;
                  String value;

                  Record(String date, String value) {
                      this.date = date;
                      this.value = value;
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  sp = getSharedPreferences(
                          "daily_numbers",
                          MODE_PRIVATE
                  );

                  loadRecords();
                  buildScreen();
                  updateScreen();
              }

              private TextView text(
                      String value,
                      int size
              ) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setPadding(12, 8, 12, 8);
                  return t;
              }

              private String fa(String s) {
                  return s
                          .replace("0", "۰")
                          .replace("1", "۱")
                          .replace("2", "۲")
                          .replace("3", "۳")
                          .replace("4", "۴")
                          .replace("5", "۵")
                          .replace("6", "۶")
                          .replace("7", "۷")
                          .replace("8", "۸")
                          .replace("9", "۹");
              }

              /*
               * تبدیل تاریخ میلادی گوشی به تاریخ شمسی
               */
              private String todayPersian() {

                  Calendar c = Calendar.getInstance();

                  int gy = c.get(Calendar.YEAR);
                  int gm = c.get(Calendar.MONTH) + 1;
                  int gd = c.get(Calendar.DAY_OF_MONTH);

                  int[] days = {
                          0, 31, 28, 31, 30, 31, 30,
                          31, 31, 30, 31, 30, 31
                  };

                  int gy2 = gy - 1600;
                  int gm2 = gm - 1;
                  int gd2 = gd - 1;

                  int gDayNo =
                          365 * gy2
                                  + (gy2 + 3) / 4
                                  - (gy2 + 99) / 100
                                  + (gy2 + 399) / 400;

                  for (int i = 0; i < gm2; i++) {
                      gDayNo += days[i + 1];
                  }

                  if (gm2 > 1 &&
                          ((gy % 4 == 0 && gy % 100 != 0)
                                  || gy % 400 == 0)) {
                      gDayNo++;
                  }

                  gDayNo += gd2;

                  int jDayNo = gDayNo - 79;

                  int jNp = jDayNo / 12053;
                  jDayNo %= 12053;

                  int jy =
                          979
                                  + 33 * jNp
                                  + 4 * (jDayNo / 1461);

                  jDayNo %= 1461;

                  if (jDayNo >= 366) {
                      jy += (jDayNo - 1) / 365;
                      jDayNo = (jDayNo - 1) % 365;
                  }

                  int jm;
                  int jd;

                  if (jDayNo < 186) {
                      jm = 1 + jDayNo / 31;
                      jd = 1 + jDayNo % 31;
                  } else {
                      jm = 7 + (jDayNo - 186) / 30;
                      jd = 1 + (jDayNo - 186) % 30;
                  }

                  return String.format(
                          Locale.US,
                          "%04d/%02d/%02d",
                          jy,
                          jm,
                          jd
                  );
              }

              private void buildScreen() {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setPadding(
                          18, 18, 18, 12
                  );

                  TextView title =
                          text(
                                  "ثبت عدد روزانه",
                                  27
                          );

                  title.setGravity(
                          Gravity.CENTER
                  );

                  root.addView(title);

                  todayView =
                          text(
                                  "",
                                  17
                          );

                  todayView.setGravity(
                          Gravity.CENTER
                  );

                  root.addView(todayView);

                  totalView =
                          text(
                                  "جمع کل: ۰",
                                  23
                          );

                  totalView.setGravity(
                          Gravity.CENTER
                  );

                  root.addView(totalView);

                  countView =
                          text(
                                  "تعداد روزهای ثبت‌شده: ۰",
                                  17
                          );

                  countView.setGravity(
                          Gravity.CENTER
                  );

                  root.addView(countView);

                  input =
                          new EditText(this);

                  input.setHint(
                          "عدد امروز را وارد کنید"
                  );

                  input.setSingleLine(true);

                  input.setInputType(
                          InputType.TYPE_CLASS_NUMBER
                                  | InputType.TYPE_NUMBER_FLAG_DECIMAL
                  );

                  root.addView(input);

                  Button save =
                          new Button(this);

                  save.setText(
                          "ثبت عدد امروز"
                  );

                  root.addView(save);

                  TextView listTitle =
                          text(
                                  "تمام روزهای ثبت‌شده",
                                  20
                          );

                  listTitle.setGravity(
                          Gravity.CENTER
                  );

                  root.addView(listTitle);

                  ListView list =
                          new ListView(this);

                  adapter =
                          new RecordAdapter(this);

                  list.setAdapter(adapter);

                  root.addView(
                          list,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );

                  Button reset =
                          new Button(this);

                  reset.setText(
                          "ریست همه اطلاعات"
                  );

                  root.addView(reset);

                  setContentView(root);

                  save.setOnClickListener(
                          v -> saveToday()
                  );

                  reset.setOnClickListener(
                          v -> resetAll()
                  );
              }

              private void saveToday() {

                  String value =
                          input.getText()
                                  .toString()
                                  .trim();

                  if (value.isEmpty()) {
                      input.setError(
                              "عدد وارد کنید"
                      );
                      return;
                  }

                  try {
                      Double.parseDouble(value);
                  } catch (Exception e) {
                      input.setError(
                              "عدد معتبر نیست"
                      );
                      return;
                  }

                  String date =
                          todayPersian();

                  boolean updated = false;

                  /*
                   * هر تاریخ فقط یک رکورد دارد.
                   * اگر همان روز دوباره عدد وارد شود،
                   * عدد قبلی اصلاح می‌شود.
                   */
                  for (Record r : records) {

                      if (r.date.equals(date)) {
                          r.value = value;
                          updated = true;
                          break;
                      }
                  }

                  if (!updated) {
                      records.add(
                              new Record(
                                      date,
                                      value
                              )
                      );
                  }

                  sortRecords();
                  saveRecords();

                  input.setText("");

                  updateScreen();

                  Toast.makeText(
                          this,
                          updated
                                  ? "عدد امروز اصلاح شد"
                                  : "عدد امروز ثبت شد",
                          Toast.LENGTH_SHORT
                  ).show();
              }

              private void sortRecords() {

                  Collections.sort(
                          records,
                          (a, b) ->
                                  b.date.compareTo(
                                          a.date
                                  )
                  );
              }

              private void updateScreen() {

                  double total = 0;

                  for (Record r : records) {

                      try {
                          total +=
                                  Double.parseDouble(
                                          r.value
                                  );
                      } catch (Exception ignored) {
                      }
                  }

                  String totalText;

                  if (total == Math.rint(total)) {
                      totalText =
                              String.valueOf(
                                      (long) total
                              );
                  } else {
                      totalText =
                              String.valueOf(total);
                  }

                  todayView.setText(
                          "امروز: " +
                                  fa(todayPersian())
                  );

                  totalView.setText(
                          "جمع کل همه روزها: " +
                                  fa(totalText)
                  );

                  countView.setText(
                          "تعداد روزهای ثبت‌شده: " +
                                  fa(
                                          String.valueOf(
                                                  records.size()
                                          )
                                  )
                  );

                  adapter.notifyDataSetChanged();
              }

              private void editRecord(
                      int position
              ) {

                  Record r =
                          records.get(position);

                  EditText edit =
                          new EditText(this);

                  edit.setSingleLine(true);

                  edit.setInputType(
                          InputType.TYPE_CLASS_NUMBER
                                  | InputType.TYPE_NUMBER_FLAG_DECIMAL
                  );

                  edit.setText(r.value);
                  edit.selectAll();

                  new AlertDialog.Builder(this)

                          .setTitle(
                                  "اصلاح روز " +
                                          fa(r.date)
                          )

                          .setView(edit)

                          .setNegativeButton(
                                  "لغو",
                                  null
                          )

                          .setPositiveButton(
                                  "ذخیره",
                                  (dialog, which) -> {

                                      String value =
                                              edit.getText()
                                                      .toString()
                                                      .trim();

                                      try {

                                          Double.parseDouble(
                                                  value
                                          );

                                          r.value =
                                                  value;

                                          saveRecords();
                                          updateScreen();

                                          Toast.makeText(
                                                  this,
                                                  "اصلاح شد",
                                                  Toast.LENGTH_SHORT
                                          ).show();

                                      } catch (Exception e) {

                                          Toast.makeText(
                                                  this,
                                                  "عدد معتبر نیست",
                                                  Toast.LENGTH_SHORT
                                          ).show();
                                      }
                                  }
                          )

                          .show();
              }

              private void deleteRecord(
                      int position
              ) {

                  Record r =
                          records.get(position);

                  new AlertDialog.Builder(this)

                          .setTitle(
                                  "حذف روز"
                          )

                          .setMessage(
                                  "رکورد " +
                                          fa(r.date) +
                                          " حذف شود؟"
                          )

                          .setNegativeButton(
                                  "لغو",
                                  null
                          )

                          .setPositiveButton(
                                  "حذف",
                                  (dialog, which) -> {

                                      records.remove(
                                              position
                                      );

                                      saveRecords();
                                      updateScreen();

                                      Toast.makeText(
                                              this,
                                              "رکورد حذف شد",
                                              Toast.LENGTH_SHORT
                                      ).show();
                                  }
                          )

                          .show();
              }

              private void resetAll() {

                  new AlertDialog.Builder(this)

                          .setTitle(
                                  "ریست همه اطلاعات"
                          )

                          .setMessage(
                                  "همه روزها و اعداد حذف شوند؟"
                          )

                          .setNegativeButton(
                                  "لغو",
                                  null
                          )

                          .setPositiveButton(
                                  "بله، ریست کن",
                                  (dialog, which) -> {

                                      records.clear();

                                      saveRecords();
                                      updateScreen();

                                      Toast.makeText(
                                              this,
                                              "همه اطلاعات پاک شد",
                                              Toast.LENGTH_SHORT
                                      ).show();
                                  }
                          )

                          .show();
              }

              private void loadRecords() {

                  String data =
                          sp.getString(
                                  "records",
                                  ""
                          );

                  if (data.isEmpty()) {
                      return;
                  }

                  String[] items =
                          data.split("\\|");

                  for (String item : items) {

                      String[] parts =
                              item.split(",", 2);

                      if (parts.length == 2) {

                          records.add(
                                  new Record(
                                          parts[0],
                                          parts[1]
                                  )
                          );
                      }
                  }

                  sortRecords();
              }

              private void saveRecords() {

                  StringBuilder builder =
                          new StringBuilder();

                  for (Record r : records) {

                      if (builder.length() > 0) {
                          builder.append("|");
                      }

                      builder.append(r.date);
                      builder.append(",");
                      builder.append(r.value);
                  }

                  sp.edit()
                          .putString(
                                  "records",
                                  builder.toString()
                          )
                          .apply();
              }

              class RecordAdapter
                      extends BaseAdapter {

                  private final Context context;

                  RecordAdapter(Context context) {
                      this.context = context;
                  }

                  @Override
                  public int getCount() {
                      return records.size();
                  }

                  @Override
                  public Object getItem(
                          int position
                  ) {
                      return records.get(position);
                  }

                  @Override
                  public long getItemId(
                          int position
                  ) {
                      return position;
                  }

                  @Override
                  public View getView(
                          int position,
                          View convertView,
                          ViewGroup parent
                  ) {

                      LinearLayout row =
                              new LinearLayout(
                                      context
                              );

                      row.setOrientation(
                              LinearLayout.HORIZONTAL
                      );

                      row.setGravity(
                              Gravity.CENTER_VERTICAL
                      );

                      row.setPadding(
                              4, 5, 4, 5
                      );

                      Record record =
                              records.get(position);

                      TextView info =
                              text(
                                      fa(record.date)
                                              + "   ←   "
                                              + fa(record.value),
                                      17
                              );

                      row.addView(
                              info,
                              new LinearLayout.LayoutParams(
                                      0,
                                      -2,
                                      1
                              )
                      );

                      Button edit =
                              new Button(context);

                      edit.setText(
                              "اصلاح"
                      );

                      row.addView(edit);

                      Button delete =
                              new Button(context);

                      delete.setText(
                              "حذف"
                      );

                      row.addView(delete);

                      final int p =
                              position;

                      edit.setOnClickListener(
                              v ->
                                      editRecord(p)
                      );

                      delete.setOnClickListener(
                              v ->
                                      deleteRecord(p)
                      );

                      return row;
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NumberDaily-final-apk
          path: app/build/outputs/apk/debug/app-debug.apk
